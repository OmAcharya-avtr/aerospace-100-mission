name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m downlinkpick --version
          python -m downlinkpick info
          python -m downlinkpick compare examples/cases/three_pass_declared.yaml
      - name: Validation scripts
        run: |
          python validation/validate_capacity.py
          python validation/validate_exact.py
          python validation/validate_greedy_gap.py
          python validation/validate_invariants.py
          python validation/validate_marginal.py
          python validation/validate_stability.py
          python validation/validate_valuemodel.py
          python validation/validate_compress.py
          python validation/validate_cli.py
          python validation/regenerate_cases.py
          python validation/worked_example.py
      - name: Validation scripts from another working directory
        run: |
          cd validation
          for script in validate_*.py regenerate_cases.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Committed cases are unchanged by regeneration
        run: git diff --exit-code examples/cases/
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/contact_timeline.py
          python examples/solver_comparison.py
          python examples/greedy_gap_distribution.py
          python examples/marginal_value_curve.py
          python examples/left_behind_report.py
          python examples/value_model_benchmark.py
          python examples/compressibility_benchmark.py
          python examples/stability_curve.py
