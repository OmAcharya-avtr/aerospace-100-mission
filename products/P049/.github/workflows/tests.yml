name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: Validation scripts
        working-directory: validation
        run: |
          python validate_series_construction.py
          python validate_fade_definitions.py
          python validate_analytic_lcr.py
          python validate_cross_check_x1.py
          python validate_distribution_fits.py
          python validate_markov_gof.py
          python validate_outage_classifier.py
          python regenerate_outage_model.py
          python worked_example.py
      - name: Examples
        working-directory: examples
        env:
          MPLBACKEND: Agg
        run: |
          python fade_statistics_overview.py
          python fade_duration_fit.py
          python markov_dwell_fit.py
          python outage_classifier_calibration.py
