[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkoutage"
version = "0.1.0"
description = "Outage and availability statistics for an optical link: fade durations, level-crossing rates, Markov channel-state fitting and a short-horizon outage classifier, from a supplied or generated amplitude series."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "free-space-optical",
    "fade-statistics",
    "level-crossing-rate",
    "mean-fade-duration",
    "outage-probability",
    "availability",
    "lognormal-fading",
    "scintillation",
    "markov-channel",
    "gilbert-elliott",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
examples = ["matplotlib"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib", "joblib"]

[project.scripts]
linkoutage = "linkoutage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
