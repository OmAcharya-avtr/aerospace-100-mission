[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliablock"
version = "0.1.0"
description = "Redundancy arithmetic that is explicit about the assumption doing the work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "reliability-block-diagram",
    "redundancy",
    "common-cause-failure",
    "beta-factor",
    "minimal-cut-sets",
    "importance-measures",
    "birnbaum",
    "fussell-vesely",
    "aerospace-assurance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Every range below is bounded on BOTH sides, at versions this product was
# actually measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and one of the five passed its
# whole test suite while its validation numbers moved.
#
# What was actually executed, and the honest limit of these bounds:
#
# The three RUNTIME dependencies below were measured at exactly ONE point each
# -- numpy 2.5.3, scipy 1.18.1, pyyaml 6.0.3 -- because this build ran inside a
# pre-pinned interpreter and was forbidden to install anything. Those three
# ranges state the minor version the numbers come from; they are NOT evidence
# that both ends were exercised, and that is recorded in README.md under
# Limitations.
#
# The four TOOL-ONLY packages in the optional groups were measured at TWO
# points each, because the build environment happened to carry two independent
# installations with identical numpy, scipy and pyyaml and different tooling.
# The whole suite, every validation script and every example pass under both:
#
#   matplotlib 3.10.8 and 3.11.2
#   pytest     8.4.2  and 9.1.1
#   hypothesis 6.140.3 and 6.170.9
#   ruff       0.14.2 and 0.17.2
#
# Their ceilings are set above the higher measured point and no further. See
# validation/VALIDATION.md, section 15.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "pyyaml>=6.0,<6.1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9.2", "hypothesis>=6.140,<6.171"]
examples = ["matplotlib>=3.10,<3.12"]
dev = [
    "pytest>=8.4,<9.2",
    "hypothesis>=6.140,<6.171",
    "ruff>=0.14,<0.18",
    "matplotlib>=3.10,<3.12",
]

[project.scripts]
reliablock = "reliablock.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["reliablock"]
# conftest, _bootstrap and _common are sibling modules imported by name from
# tests/, validation/ and examples/, so isort has to be told they are local
# rather than third-party.
known-local-folder = ["_bootstrap", "_common", "conftest"]
