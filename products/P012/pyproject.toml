[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navbench"
version = "0.1.0"
description = "A controlled bench for aerospace attitude and navigation filters: KF/EKF/UKF/MEKF with first-class NEES/NIS consistency diagnostics and a learned adaptive process-noise tuner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "kalman-filter",
    "ekf",
    "ukf",
    "mekf",
    "attitude-determination",
    "navigation",
    "nees",
    "nis",
    "filter-consistency",
    "aerospace",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
navbench = "navbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "validation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
