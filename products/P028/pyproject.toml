[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skymatch"
version = "0.1.0"
description = "Lost-in-space star identification: synthetic catalogue preparation, triangle and pyramid pattern matching with tolerance handling, and a learned candidate ranker benchmarked against the classical pyramid rule on identification rate and false-identification rate"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["star-identification", "star-tracker", "lost-in-space", "pyramid-algorithm", "aerospace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
examples = ["matplotlib>=3.7"]
dev = ["pytest", "hypothesis", "matplotlib>=3.7", "ruff"]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/skymatch"
Source = "https://github.com/OmAcharya-avtr/skymatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# validation/ and examples/ scripts run from a cold clone without an install,
# so they put src/ on sys.path before importing the package. That forces
# imports below executable code (E402) and a non-alphabetical order (I001).
"validation/*.py" = ["E402", "I001"]
"examples/*.py" = ["E402", "I001"]
