name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/ examples/ validation/
      - name: Tests
        run: python -m pytest tests/ -q
      - name: CLI smoke test
        run: python -m dopplerkit --help && python -m dopplerkit convention
      - name: Validation scripts
        run: |
          python validation/validate_range_rate.py
          python validation/validate_doppler_closedform.py
          python validation/validate_two_way_relativistic.py
          python validation/validate_lighttime.py
          python validation/validate_tle_pass.py
