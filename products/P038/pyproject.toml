[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dopplerkit"
version = "0.1.0"
description = "Doppler and range-rate geometry for a satellite link, with one-way and two-way kept explicitly separate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["doppler", "range-rate", "satellite", "link-geometry", "light-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy", "scipy", "sgp4"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
dopplerkit = "dopplerkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
