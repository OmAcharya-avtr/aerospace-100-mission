[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellink"
version = "0.1.0"
description = "Time-varying constellation contact graphs, routing over a time-expanded graph, and per-link RF/optical capacity"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "OPTIMA Organisation" }]
requires-python = ">=3.11"
keywords = ["satellite", "constellation", "contact-graph", "routing", "link-budget", "sgp4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "sgp4>=2.20",
    "pulp>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "hypothesis>=6.80", "ruff>=0.5"]

[project.scripts]
constellink = "constellink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "ISC"]
ignore = ["B008"]
