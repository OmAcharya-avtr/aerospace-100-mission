[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlinerisk"
version = "0.1.0"
description = "The factor by which the mean-plus-margin rule understates a measured deadline-miss rate, with a dependence-aware interval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "hard-real-time",
    "deadline-miss",
    "worst-case-execution-time",
    "extreme-value-theory",
    "generalised-pareto",
    "moving-block-bootstrap",
    "jetson-orin-nano",
    "hardware-in-the-loop",
    "edge-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]

# Every range is bounded on BOTH sides, at the version every number in this
# repository was measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and one of the five passed its
# whole suite while its validation numbers moved.
#
# WHAT EACH DEPENDENCY IS USED FOR, so a bound can be argued with rather than
# taken on trust.
#
# numpy -- every array; `numpy.percentile` with its DEFAULT linear
# interpolation for every bootstrap interval; `numpy.quantile` for the EVT
# candidate threshold grid; and the `numpy.random.Generator` (PCG64) streams
# behind the moving-block bootstrap and the synthetic fixture. Three reasons
# for a ceiling, two of them numerical. The percentile and quantile
# interpolation rules are library defaults, and a change to either would move
# every interval and every chosen threshold in `validation/`. The generator
# stream is the strongest: `tests/test_fixtures.py` asserts the generated
# traces are byte-identical at a fixed seed, and `tests/test_regressions.py`
# pins the totals those traces produce.
#
# scipy -- `scipy.stats.norm.sf` for the mean-plus-margin tail (used rather
# than `1 - cdf` because the quantity is evaluated far into the tail) and
# `scipy.stats.genpareto.fit` for every peaks-over-threshold fit. The GPD fit
# is a maximum-likelihood optimisation whose result is a reported number, so
# the bound is numerical and not merely an API bound.
#
# scikit-learn -- `RandomForestRegressor` in the learned predictor. Bounded to
# the minor version because the across-tree spread this product reports as its
# uncertainty output depends on the forest's `random_state` draw order, and
# `tests/test_predictor.py` asserts the forest cannot predict outside its
# training target range, which is a property of the estimator's implementation
# and not of its API.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The mission's build guide
# asks for the suite to be run at both ends of every declared range. That was
# not possible for numpy, scipy, scikit-learn, pytest, hypothesis or
# matplotlib: the build environment is a shared pre-pinned interpreter that
# this product is forbidden to run pip against, so a second version of any of
# them could not be installed. Those ranges are bounded at the single version
# each was MEASURED at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1,
# pytest 9.1.1, hypothesis 6.170.15, matplotlib 3.11.2 -- widened only to the
# patch floor the code plainly supports. The ruff range is the one exception
# and is measured at both ends: two ruff installations were present, 0.16.9 on
# the path and 0.17.5 as a Python module, and
# `ruff check src/ tests/ examples/ validation/` is clean under both.
# A pin below a future security release is a real cost, not a free safety
# measure; the tension is recorded in README.md under Limitations rather than
# resolved by removing the ceiling.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171", "ruff>=0.16,<0.18"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
deadlinerisk = "deadlinerisk.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/deadlinerisk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
# data/campaign.py is the measurement script AS IT RAN ON THE BOARD, byte for
# byte. It is excluded from linting rather than reformatted, because editing it
# would make the committed copy differ from the program that produced every
# measured number in this repository. The ruff scope used everywhere in this
# product is `src/ tests/ examples/ validation/`, and the exclusion is recorded
# in README.md under Limitations.
extend-exclude = ["data/campaign.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["deadlinerisk"]
known-local-folder = ["_bootstrap", "_common", "fixtures"]
