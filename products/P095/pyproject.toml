[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardprobe"
version = "0.1.0"
description = "A hardware abstraction layer whose readings carry their provenance through to the result."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "hardware-in-the-loop",
    "hardware-abstraction-layer",
    "provenance",
    "jetson-orin-nano",
    "benchmark-harness",
    "telemetry",
    "sysfs",
    "perf-event-open",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole suite while its validation numbers moved.
#
# WHAT numpy IS USED FOR HERE, so the bound can be argued with. Three things:
# the mean, sample standard deviation (ddof=1), median and 0.95 quantile in
# `boardprobe.statistics` and `boardprobe.harness`; the
# `numpy.random.Generator` (PCG64) stream that makes `SimulatedSource`
# reproducible; and nothing else. Two of those are reasons for a ceiling. The
# 0.95 quantile goes through `numpy.quantile` with its DEFAULT linear
# interpolation, which is a library default and would move the reported figure
# if it changed. The generator stream is the stronger reason: the two committed
# trace fixtures under `fixtures/` were written by `SimulatedSource` at declared
# seeds, `tests/test_fixtures.py` re-synthesises each of them and compares
# value by value, and a change in the PCG64 stream or in
# `Generator.standard_normal` would make those two tests fail. That makes the
# fixtures a serialised artifact in the sense the build guide means, and the
# library that wrote them is bounded to the minor version accordingly.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible for numpy, pytest, hypothesis or matplotlib: the build environment
# is a shared pre-pinned interpreter this product is forbidden to run pip
# against, so a second version of any of them could not be installed. Those
# ranges are bounded at the single version each was MEASURED at -- numpy 2.5.3,
# pytest 9.1.1, hypothesis 6.170.15, matplotlib 3.11.2 -- widened only to the
# patch floor the code plainly supports. numpy 2.5.4 exists on PyPI and is
# admitted by `<2.6`; it was NOT tested, and that gap is recorded in README.md
# under Limitations rather than papered over by narrowing the bound to a
# version nobody can install. The ruff range is the one exception: two ruff
# installations were present in the measured environment, 0.16.9 on the path
# and 0.17.4 as a Python module, and `ruff check src/ tests/ examples/
# validation/` is clean under both, so that range is measured at both ends.
dependencies = ["numpy>=2.5,<2.6"]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171", "ruff>=0.16,<0.18"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
boardprobe = "boardprobe.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/boardprobe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["boardprobe"]
known-local-folder = ["_bootstrap", "_common"]
