[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softdecode"
version = "0.1.0"
description = "Soft-decision demapping over fading optical channels, including the mismatched-channel-state penalty."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "free-space-optical",
    "log-likelihood-ratio",
    "soft-decision-demapping",
    "lognormal-fading",
    "gamma-gamma",
    "on-off-keying",
    "pulse-position-modulation",
    "channel-state-information",
    "ldpc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
examples = ["matplotlib"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
softdecode = "softdecode.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
