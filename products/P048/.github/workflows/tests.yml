name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: CLI
        run: python -m softdecode --help
      - name: Validation scripts
        run: |
          python validation/validate_quadrature.py
          python validation/validate_awgn_limit.py
          python validation/validate_maxlog_clipping.py
          python validation/validate_csi_mismatch.py
          python validation/validate_cross_check_x3.py
          python validation/validate_corrector.py
          python validation/worked_example.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/llr_curves.py
          python examples/mismatch_asymmetry.py
          python examples/clipping_cost.py
          python examples/corrector_benchmark.py
