[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoverloss"
version = "0.1.0"
description = "Which mechanism dominates the data loss across an optical ground-station handover: acquisition, protocol restart or buffer drain, with an interval on each."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "optical-communications",
    "free-space-optical",
    "ground-station-handover",
    "acquisition-pointing-tracking",
    "fluid-queue",
    "loss-attribution",
    "bootstrap-confidence-interval",
    "network-calculus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]

# Every range is bounded on BOTH sides, at the version every number in this
# repository was measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and one of the five passed its
# whole suite while its validation numbers moved.
#
# WHAT EACH DEPENDENCY IS USED FOR, so a bound can be argued with rather than
# taken on trust.
#
# numpy -- every array; the `numpy.random.Generator` (PCG64) streams behind the
# corpus generator, the trace simulator's burst and jitter factors and the
# bootstrap's resample indices; and `numpy.percentile` with its DEFAULT linear
# interpolation for every bootstrap bound. Two reasons for a ceiling, both
# numerical rather than API. The generator stream is the stronger: the committed
# corpus `data/corpus/handovers.csv` is byte-pinned by its sha256 in
# `data/corpus/manifest.json` and `tests/test_regressions.py` pins the dominance
# counts and the baseline accuracies that corpus produces, so a change to the
# PCG64 stream or to `Generator.standard_normal`'s algorithm would invalidate
# every published figure. The percentile interpolation rule would move every
# interval in `validation/`.
#
# scipy -- `scipy.stats.lognorm` for the acquisition-time body, `scipy.stats.norm`
# for the closed-form truncated-lognormal moments and for the z used by the
# predictor's uncertainty band, and `numpy.polynomial.legendre.leggauss` by way
# of the quadrature cross-check in `tests/test_acquisition.py`. The closed-form
# moments are reported numbers, so the bound is numerical and not merely an API
# bound.
#
# scikit-learn -- `RandomForestRegressor` in the learned predictor. Bounded to
# the minor version because the across-tree spread this product reports as its
# uncertainty output depends on the forest's `random_state` draw order, and
# `tests/test_predictor.py` asserts that a refit at a fixed seed reproduces the
# prediction bit for bit.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The mission's build guide
# asks for the suite to be run at both ends of every declared range. That was
# not possible for numpy, scipy, scikit-learn, pytest, hypothesis or
# matplotlib: the build environment is a shared pre-pinned interpreter that this
# product is forbidden to run pip against, so a second version of any of them
# could not be installed. Those ranges are bounded at the single version each
# was MEASURED at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1, pytest
# 9.1.1, hypothesis 6.170.15, matplotlib 3.11.2 -- widened only to the patch
# floor the code plainly supports. The ruff range is the one exception and is
# measured at both ends: two ruff installations are present, 0.16.9 on the path
# and 0.17.5 as a Python module, and `ruff check src/ tests/ examples/
# validation/ data/` is clean under both. A pin below a future security release
# is a real cost, not a free safety measure; the tension is recorded in
# README.md under Limitations rather than resolved by removing the ceiling.
#
# NOT a dependency: this product ships no serialised model, so there is no
# pickle-format coupling beyond the stream coupling above. The forest is refitted
# from the committed corpus in under two seconds.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171", "ruff>=0.16,<0.18"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
handoverloss = "handoverloss.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/handoverloss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["handoverloss"]
known-local-folder = ["_bootstrap", "_common"]
