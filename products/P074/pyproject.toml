[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdrift"
version = "0.1.0"
description = "How wrong an ephemeris has become, as a measured curve against epoch age."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "sgp4",
    "two-line-element",
    "ephemeris-staleness",
    "orbit-propagation",
    "model-divergence",
    "prediction-interval",
    "conformal-prediction",
    "coverage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every range is bounded on BOTH sides, at the versions every number in this
# repository was measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and in one of the five the test
# suite passed while the validation numbers moved, which no test catches.
#
# The cost of the ceilings is real and is recorded in README.md under
# Limitations: this package cannot take a numpy 2.6, a scipy 1.19, a
# scikit-learn 1.10 or an sgp4 2.28 release without a port and a
# re-measurement.
#
# The sgp4 ceiling is the one to look at twice. It is not only an API bound:
# the published verification vectors SGP4-VER.TLE and tcppver.out are read out
# of the installed sgp4 distribution as package data, and
# validation/validate_sgp4_vectors.py reports a disagreement measured against
# those exact files. A release that revised either file, or moved it, would
# change a published number here or break the read.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
    "sgp4>=2.27,<2.28",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<8.5", "hypothesis>=6.140,<6.141"]
examples = ["matplotlib>=3.10,<3.11"]
dev = [
    "pytest>=8.4,<8.5",
    "hypothesis>=6.140,<6.141",
    "ruff>=0.14,<0.15",
    "matplotlib>=3.10,<3.11",
]

[project.scripts]
orbitdrift = "orbitdrift.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["orbitdrift"]
known-local-folder = ["_bootstrap", "_common", "conftest"]
