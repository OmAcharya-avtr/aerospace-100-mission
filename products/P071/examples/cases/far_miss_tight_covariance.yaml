name: far-miss-tight-covariance
description: >-
  A declared synthetic case with a well-determined state and a miss distance
  many standard deviations away, so that the collision probability is far into
  the Gaussian tail. It is shipped to show the regime in which the Monte Carlo
  reference becomes impractical: at this probability the sample count needed for
  a useful interval is outside this product's three-minute compute budget, and
  the report says so rather than quoting a Monte Carlo estimate with no hits.
hard_body_radius_m: 10.0
