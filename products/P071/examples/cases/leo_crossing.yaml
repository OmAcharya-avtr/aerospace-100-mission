name: leo-crossing
description: >-
  A declared synthetic 45-degree crossing conjunction in a 700 km circular low
  Earth orbit. The primary state is a circular orbit at that altitude; the
  secondary is offset by a declared 30 m radial, 110 m along-track and 40 m
  cross-track and its velocity is the primary's rotated by 45 degrees about the
  radial direction. Covariances are declared radial / along-track / cross-track
  standard deviations with the along-track component the largest, which is the
  usual shape for a low Earth orbit determination solution. No value here was
  identified from any vehicle, catalogue or operator product.
hard_body_radius_m: 12.0
primary:
  name: primary
  position_m: [7078137.0, 0.0, 0.0]
  velocity_mps: [0.0, 7504.0, 0.0]
  sigma_rtn_m: [20.0, 100.0, 20.0]
secondary:
