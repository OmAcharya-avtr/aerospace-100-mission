name: large-body-tight-covariance
description: >-
  A declared synthetic case chosen so that the hard body is large compared with
  the position uncertainty. This is the regime in which the analytic methods
  disagree with each other by more than a rounding error, which is why the case
  is shipped: it exercises the part of the report that matters. A combined
  hard-body radius of 30 m against an effective encounter-plane uncertainty of
  about 20 m is physically unusual and is declared, not observed.
hard_body_radius_m: 30.0
primary:
  name: primary
  position_m: [7078137.0, 0.0, 0.0]
  velocity_mps: [0.0, 7504.0, 0.0]
  sigma_rtn_m: [8.0, 30.0, 8.0]
