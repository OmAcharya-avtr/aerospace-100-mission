name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/ fixtures/
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: CLI smoke test
        run: python -m hazardtrace codes
      - name: The clean example must exit 0
        run: python -m hazardtrace check examples/cases/complete_minimal.yaml
      - name: The worked example must exit 1, because its gaps are real
        run: |
          if python -m hazardtrace check examples/cases/p024_bdot_detumble.yaml \
              -r fixtures/p024_bdot/docs/REQUIREMENTS.md \
              -t fixtures/p024_bdot/junit.xml; then
            echo "expected a non-zero exit from the worked example"
            exit 1
          fi
