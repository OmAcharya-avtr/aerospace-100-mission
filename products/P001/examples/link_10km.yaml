# BeamTwin example scenario: 10 km terrestrial FSO link, 1550 nm.
# Moderate turbulence, light haze, small residual tracking jitter.
name: terrestrial-10km
link:
  wavelength_nm: 1550
  tx_power_dbm: 20.0          # 100 mW
  tx_efficiency: 0.8
  rx_efficiency: 0.8
  beam_waist_radius_m: 0.02   # 2 cm waist -> ~24.7 urad half-angle divergence
  rx_aperture_radius_m: 0.05  # 10 cm aperture
  range_km: 10.0
  pointing_bias_urad: 2.0
  attenuation_db_per_km: 2.5  # light haze at 1550 nm (Kim model, V ~ 7 km)
  rx_sensitivity_dbm: -30.0
channel:
  cn2: 5.0e-16                # moderate turbulence [m^-2/3]
  pointing_jitter_urad: 5.0   # per-axis RMS jitter
monte_carlo:
  n_samples: 200000
  seed: 1
