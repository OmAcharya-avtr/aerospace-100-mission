[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamtwin"
version = "0.1.0"
description = "FSO link digital twin: deterministic link budget, stochastic atmospheric channel, Monte Carlo fade statistics, ML fade-probability surrogate"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "OPTIMA Organisation"}]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
