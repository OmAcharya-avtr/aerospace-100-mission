[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twininvalidate"
version = "0.1.0"
description = "Model-invalidation monitor for a linear-Gaussian digital twin: detection delay against false-alarm rate, per change type, with a learned drift classifier benchmarked against CUSUM, EWMA and a windowed GLR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "digital-twin",
    "model-invalidation",
    "change-detection",
    "cusum",
    "ewma",
    "generalised-likelihood-ratio",
    "average-run-length",
    "kalman-filter-residual",
    "aerospace-assurance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
examples = ["matplotlib"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
twininvalidate = "twininvalidate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
