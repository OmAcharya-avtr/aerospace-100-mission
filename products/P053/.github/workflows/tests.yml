name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: CLI
        run: python -m twininvalidate --help
      - name: Validation scripts
        run: |
          python validation/validate_twin.py
          python validation/validate_detectors.py
          python validation/validate_arl_curve.py
          python validation/validate_ambiguity.py
          python validation/validate_cli.py
          python validation/worked_example.py
      # validate_thresholds.py exits 1 on purpose: 2 of its 15 checks FAIL,
      # the variance-CUSUM oracle's ARL0 transfer bias at targets 200 and
      # 1000. The failure is a published result (validation/VALIDATION.md
      # section 3.6), not a defect to be fixed by deleting the check, so the
      # script is run and its output kept without failing the build.
      - name: Validation scripts with a known failing check
        continue-on-error: true
        run: python validation/validate_thresholds.py
      # The classifier benchmark takes about 65 s per Python version. It is
      # run on 3.13 only to keep CI inside a sensible budget.
      - name: Learned-model benchmark
        if: matrix.python-version == '3.13'
        run: python validation/validate_classifier.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/residual_stream.py
          python examples/detector_statistics.py
          python examples/arl_curve.py
          python examples/invalidation_vs_fault.py
      - name: Classifier figure
        if: matrix.python-version == '3.13'
        env:
          MPLBACKEND: Agg
        run: python examples/classifier_benchmark.py
