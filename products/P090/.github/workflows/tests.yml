name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m tlecheck --version
          python -m tlecheck info
          python -m tlecheck determinability --objects 12
          python -m tlecheck check --objects 48 --corruption sign_flip
          python -m tlecheck consequence --objects 120
          python -m tlecheck screen --objects 120
          python -m tlecheck benchmark --objects 180
          python -m tlecheck divergence --objects 60
      - name: Validation scripts
        run: |
          python validation/validate_elements.py
          python validation/validate_baseline_history.py
          python validation/validate_bounds.py
          python validation/validate_consequence.py
          python validation/validate_rule_screens.py
          python validation/validate_controls.py
          python validation/validate_learned.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Validation scripts from the gate's working directory
        run: |
          cd validation
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/element_set_anatomy.py
          python examples/consequence_by_corruption.py
          python examples/sign_flip_growth.py
          python examples/precision_recall_grid.py
          python examples/recall_at_fpr.py
          python examples/determinability.py
          python examples/continuity_resolution.py
          python examples/corruption_transfer.py
          python examples/learned_confidence.py
          python examples/screen_verdict.py
      - name: Working-directory probe
        run: python validation/probe_working_directories.py
