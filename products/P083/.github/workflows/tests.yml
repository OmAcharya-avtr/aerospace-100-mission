name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junit-xml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m hilverdict --version
          python -m hilverdict threshold --steps 200
          python -m hilverdict certify --seed 902 --profile loaded --amplitude-deg 8.0
          python -m hilverdict resimulate --seed 902 --profile loaded --amplitude-deg 8.0
          python -m hilverdict verdict --seed 902 --profile loaded --amplitude-deg 8.0
          python -m hilverdict clock --seed 902 --drift-ppm 5000
          python -m hilverdict clock --seed 902 --resets 0.4
          python -m hilverdict learned --train-runs 9 --test-runs 6 --steps 120
      - name: Validation scripts
        run: |
          python validation/validate_plant.py
          python validation/validate_certificate.py
          python validation/validate_independent_bound.py
          python validation/validate_resimulation.py
          python validation/validate_clock.py
          python validation/validate_learned_model.py
          python validation/validate_negative_controls.py
          python validation/validate_approx_audit.py
          python validation/validate_examples.py
          python validation/worked_example.py
      - name: Validation scripts from the gate's working directory
        run: |
          cd validation
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/certificate_threshold.py
          python examples/miss_disposition.py
          python examples/bound_vs_truth.py
          python examples/divergence_traces.py
          python examples/recall_tradeoff.py
          python examples/clock_drift.py
          python examples/verdict_and_cost.py
      - name: The tree must be clean of caches and absolute paths
        run: python validation/validate_cli.py
