[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hilverdict"
version = "0.1.0"
description = "Decide whether a hardware-in-the-loop run was timing-faithful, and separate the deadline misses that mattered from the ones that provably did not."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "hardware-in-the-loop",
    "real-time",
    "deadline-miss",
    "sampled-data-control",
    "logarithmic-norm",
    "trajectory-divergence",
    "clock-drift",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole test suite while its validation numbers moved.
#
# numpy carries every array operation here. The certificate's horizon gains of
# equation (12) are induced 2-norms from `numpy.linalg.norm`, and the clock
# estimators use `numpy.median` and `numpy.linalg` least squares; a change in
# any of those moves numbers that are reported to six decimal places.
#
# scipy supplies exactly two things: `scipy.linalg.expm`, which is the Van Loan
# block exponential at the heart of equations (7) and (10), and
# `scipy.stats.beta`, which is the Clopper-Pearson interval of
# `hilverdict.scoring`. Both are load-bearing for published numbers.
#
# scikit-learn supplies `GradientBoostingClassifier`. Its fitting is seeded and
# reproducible WITHIN a version and is not part of its public API contract
# across versions, so the ceiling is at the minor version. No model artifact is
# serialised or committed by this product -- every model in validation/ is
# refitted from a declared seed by the script that reports it -- so there is no
# pickle whose format needs bounding.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible for numpy, scipy, scikit-learn, matplotlib, pytest and hypothesis:
# the build environment is a shared pre-pinned interpreter that this product is
# forbidden to modify, and installing a second version of any of them would
# have required running pip. Those ranges are bounded at the single version
# each was MEASURED at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1,
# matplotlib 3.11.2, pytest 9.1.1, hypothesis 6.170.14 -- widened only to the
# patch floor the code plainly supports. The ruff range is the one exception:
# two ruff installations were present in the measured environment, 0.16.9 on
# the path and 0.17.3 as a Python module, and `ruff check src/ tests/
# examples/ validation/` is clean under both, so that range is measured at both
# ends. This is recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
hilverdict = "hilverdict.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/hilverdict"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hilverdict"]
known-local-folder = ["_bootstrap", "_common"]
