[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalbudget"
version = "0.1.0"
description = "Sustained on-board throughput after thermal equilibrium, against the cold-burst figure, with the gap as the headline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "thermal-throttling",
    "hardware-in-the-loop",
    "jetson-orin-nano",
    "sustained-throughput",
    "thermal-rc-network",
    "bootstrap-confidence-interval",
    "benchmarking",
    "edge-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]

# Every range is bounded on BOTH sides, at the version every number in this
# repository was measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and one of the five passed its whole
# suite while its validation numbers moved.
#
# WHAT EACH DEPENDENCY IS USED FOR, so the bound can be argued with rather than
# taken on trust.
#
# numpy -- every array, every mean and standard deviation, `numpy.percentile`
# with its DEFAULT linear interpolation for every bootstrap interval, and the
# `numpy.random.Generator` (PCG64) streams behind the bootstrap and the group
# resampling. Two of those are reasons for a ceiling. The percentile
# interpolation rule is a library default and a change to it would move every
# interval in `validation/`. The generator stream is the stronger reason: every
# interval and every synthetic fixture in this repository is reproducible only
# while `Generator.integers` and `Generator.normal` produce the same draws, and
# `tests/test_fixtures.py` asserts byte-for-byte determinism of the generated
# traces at a fixed seed.
#
# scipy -- `scipy.optimize.minimize_scalar(method="bounded")` for the one-
# dimensional tau search inside the separable relaxation fit, and
# `scipy.stats.t.ppf` for the independent Student-t interval over per-run means.
# Both are numerical-result-bearing, so both are bounded.
#
# scikit-learn -- `Ridge` and `RandomForestRegressor` in the learned predictor.
# Bounded to the minor version because the forest's prediction depends on its
# `random_state` draw order, and `tests/test_predictor.py` asserts that the
# forest cannot extrapolate past its training targets, which is a property of
# the estimator's implementation and not of its API.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The mission's build guide
# asks for the suite to be run at both ends of every declared range. That was
# not possible for numpy, scipy, scikit-learn, pytest, hypothesis or matplotlib:
# the build environment is a shared pre-pinned interpreter that this product is
# forbidden to run pip against, so a second version of any of them could not be
# installed. Those ranges are bounded at the single version each was MEASURED
# at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1, pytest 9.1.1, hypothesis
# 6.170.15, matplotlib 3.11.2 -- widened only to the patch floor the code plainly
# supports. The ruff range is the one exception and is measured at both ends:
# two ruff installations were present, 0.16.9 on the path and 0.17.4 as a Python
# module, and `ruff check src/ tests/ examples/ validation/` is clean under both.
# A pin below a future security release is a real cost, not a free safety
# measure; the tension is recorded in README.md under Limitations rather than
# resolved by removing the ceiling.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171", "ruff>=0.16,<0.18"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
thermalbudget = "thermalbudget.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/thermalbudget"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["thermalbudget"]
known-local-folder = ["_bootstrap", "_common", "fixtures"]
