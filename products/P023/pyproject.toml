[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alloclab"
version = "0.1.0"
description = "Control allocation for over-actuated spacecraft: thruster and reaction-wheel effector models, pseudo-inverse / LP / QP allocators with actuator bounds, attainable-moment-set geometry, failure reallocation, and a learned QP surrogate benchmarked against the exact QP"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["control-allocation", "attainable-moment-set", "thruster", "reaction-wheel", "aerospace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pulp>=2.7",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/alloclab"
Source = "https://github.com/OmAcharya-avtr/alloclab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
