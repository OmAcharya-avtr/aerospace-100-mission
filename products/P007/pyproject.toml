[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quatkit"
version = "0.1.0"
description = "Quaternion and attitude-representation toolbox for aerospace GNC (scalar-first, Hamilton convention). Educational / research-grade."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OPTIMA Organisation" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
