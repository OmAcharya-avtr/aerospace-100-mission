name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m relfiledelivery --version
          python -m relfiledelivery info
          python -m relfiledelivery analytic --file-bytes 262144 --loss 0.05
          python -m relfiledelivery simulate --file-bytes 262144 --loss 0.05
          python -m relfiledelivery compare --file-bytes 262144 --loss 0.05 --runs 100
      - name: Validation scripts
        run: |
          python validation/validate_analytic.py
          python validation/validate_simulation_vs_closed_form.py
          python validation/validate_completion_invariant.py
          python validation/validate_retransmission_accounting.py
          python validation/validate_reproducibility.py
          python validation/validate_distributions.py
          python validation/validate_predictors.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Validation scripts from their own directory
        working-directory: validation
        run: |
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Committed validation output is unchanged by re-running
        run: git diff --stat validation/
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/delivery_time_distribution.py
          python examples/mode_comparison.py
          python examples/analytic_vs_simulation.py
          python examples/outage_sensitivity.py
          python examples/completion_per_contact.py
          python examples/predictor_benchmark.py
      - name: No absolute home-directory path in any tracked file
        run: |
          if git grep -nI -E '/home/[a-z]+/|/Users/[a-zA-Z]+/' -- . ; then
            echo "absolute path found in a tracked file"
            exit 1
          fi
