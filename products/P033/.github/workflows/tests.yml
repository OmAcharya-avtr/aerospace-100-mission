name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml

      - name: Validation scripts
        run: |
          for s in validate_opcounts validate_memory validate_onnxruntime \
                   validate_uncertainty validate_backend_cost_model \
                   validate_budget validate_performance validate_predictor; do
            echo "=== $s ==="
            python "validation/$s.py"
          done

      - name: Examples
        run: |
          for e in examples/*.py; do
            echo "=== $e ==="
            python "$e"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
