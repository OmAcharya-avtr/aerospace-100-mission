[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regressselect"
version = "0.1.0"
description = "Regression test selection with measured safety loss: which tests a diff can skip, and what skipping them cost"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Om Acharya" }]
keywords = [
  "regression-test-selection",
  "test-prioritisation",
  "apfd",
  "safety-loss",
  "pytest",
  "aerospace",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
# Both ends of every range were executed in the build session; see
# validation/validate_environment_output.txt for the exact installed versions
# and README.md "Limitations" for what the ceiling costs.
dependencies = [
  "numpy>=2.5.3,<2.6",
  "scikit-learn>=1.9.1,<1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11.2,<3.12"]
test = [
  "pytest>=9.1.1,<9.2",
  "hypothesis>=6.169.3,<6.170",
  "matplotlib>=3.11.2,<3.12",
  "ruff>=0.17.0,<0.18",
]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/regressselect"
Source = "https://github.com/OmAcharya-avtr/regressselect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
junit_family = "xunit1"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# fixtures/ is a FIXTURE project, deliberately containing seeded faults and
# deliberately not lint-clean-by-this-config; it is parsed, not imported.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
