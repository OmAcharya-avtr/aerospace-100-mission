[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemgap"
version = "0.1.0"
description = "Separate missing telemetry from corrupt telemetry from a reader that is wrong, and emit a refusable gap policy instead of a silent interpolation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "telemetry",
    "space-operations",
    "data-integrity",
    "gap-analysis",
    "interpolation",
    "ccsds",
    "anomaly-classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Every range below is bounded on BOTH sides, at the versions every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole suite while its validation numbers moved.
#
# scikit-learn is the sharpest case here. `telemgap.learned` reads
# `RandomForestClassifier.estimators_` and calls `predict_proba` on individual
# members to compute the per-member vote dispersion it reports as an
# uncertainty output. `estimators_` is documented but the per-member
# probability semantics are not covered by any cross-minor stability promise,
# so the ceiling sits at the minor version. The cost of that ceiling is
# recorded in README.md under Limitations: this package cannot take a
# scikit-learn 1.10 release without a port and a re-measure.
#
# numpy is bounded one notch looser. The code depends on int64 and uint16
# semantics, on `np.bitwise_count`, and on `np.median`/`np.diff` behaviour, all
# long-stable; but numpy has resolved to three different patch releases across
# sessions of this mission on an unbounded specifier.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible here: the build environment is a shared pre-pinned interpreter that
# this product is forbidden to modify, and installing a second version of numpy
# or scikit-learn would have required running pip. Both ranges are therefore
# bounded at the single version each was MEASURED at -- numpy 2.5.3 and
# scikit-learn 1.9.1 -- widened only to the patch and minor floor the code
# plainly supports. The ruff range is the one exception: 0.16.9 and 0.17.3 were
# both available and the source measured clean under both, so that range is
# measured at both ends. This is recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
telemgap = "telemgap.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/telemgap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["telemgap"]
known-local-folder = ["_bootstrap", "_common"]
