name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m telemgap --version
          python -m telemgap info
          python -m telemgap check --samples 2000
          python -m telemgap policy --samples 2000
          python -m telemgap refuse --outage-frames 21600
          python -m telemgap determinability --samples 1200 --withhold raw
          python -m telemgap benchmark --samples 3000
      - name: Validation scripts
        run: |
          python validation/validate_rule_screens.py
          python validation/validate_classification.py
          python validation/validate_interpolation_policy.py
          python validation/validate_refusal_controls.py
          python validation/validate_learned.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Validation scripts from the gate's working directory
        run: |
          cd validation
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/telemetry_record.py
          python examples/gap_map.py
          python examples/classification_confusion.py
          python examples/interpolation_error_vs_gap.py
          python examples/refusal_boundary.py
          python examples/curvature_estimator.py
          python examples/rules_versus_learned.py
          python examples/learned_confidence.py
          python examples/determinability.py
