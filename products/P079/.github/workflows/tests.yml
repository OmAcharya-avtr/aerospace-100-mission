name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: The committed fixture is present and is not hardware
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from timetransfer.exchange import ExchangeSet
          path = Path("fixtures/recorded_exchange.json")
          if not path.exists():
              sys.exit("fixtures/recorded_exchange.json is missing from the clone")
          recorded = ExchangeSet.read_json(path)
          print(f"{recorded.n} exchanges, digest {recorded.digest()}")
          if recorded.is_hardware:
              sys.exit("the committed recording claims to be hardware")
          PY
      - name: CLI
        run: |
          python -m timetransfer version
          python -m timetransfer info
          python -m timetransfer parity --n 300
          python -m timetransfer preflight --n 60
          python -m timetransfer dryrun fixtures/recorded_exchange.json
      - name: Validation scripts
        env:
          MPLBACKEND: Agg
        run: |
          python validation/validate_symmetric_bias.py
          python validation/validate_skew_estimators.py
          python validation/validate_allan.py
          python validation/validate_uncertainty_coverage.py
          python validation/validate_parity.py
          python validation/validate_dryrun.py
          python validation/validate_reproducibility.py
          python validation/validate_asymmetry_benchmark.py
          python validation/validate_deployment.py
          python validation/validate_benchmark_table.py
          python validation/worked_example.py
          python validation/validate_cli.py
      - name: Validation scripts from another working directory
        env:
          MPLBACKEND: Agg
          TIMETRANSFER_FAST: "1"
        run: |
          cd validation
          for script in validate_*.py worked_example.py regenerate_fixture.py; do
            python "$script" > /dev/null
          done
      - name: The committed fixture is unchanged by regeneration
        run: |
          python validation/regenerate_fixture.py
          git diff --exit-code fixtures/
      - name: The Level 4 hardware rows are still empty
        run: |
          python - <<'PY'
          import json, sys
          record = json.loads(open("validation/benchmark_record.json").read())
          if record["is_hardware"]:
              sys.exit("the benchmark record claims to be hardware")
          rows = record["hardware"]
          if len(rows) != 5:
              sys.exit(f"expected 5 hardware rows, found {len(rows)}")
          for row in rows:
              if row["value"] is not None or row["status"] != "unmeasured":
                  sys.exit(f"hardware row {row['stage']} is no longer empty")
          print("5 hardware rows, all empty, all unmeasured")
          PY
      - name: No absolute home-directory path in any tracked file
        run: |
          python - <<'PY'
          import subprocess, sys
          # The needles are built from character codes rather than written out,
          # because a workflow that searched for the literal strings would match
          # itself and fail the repository it is checking.
          needles = [
              "".join(map(chr, (47, 104, 111, 109, 101, 47))),
              "".join(map(chr, (47, 85, 115, 101, 114, 115, 47))),
          ]
          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()
          offenders = []
          for name in files:
              if name.endswith((".png", ".jpg", ".pdf")):
                  continue
              try:
                  text = open(name, encoding="utf-8", errors="strict").read()
              except (UnicodeDecodeError, OSError):
                  continue
              for needle in needles:
                  if needle in text:
                      offenders.append(f"{name}: contains {needle!r}")
          for line in offenders:
              print(line)
          sys.exit(1 if offenders else 0)
          PY
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/offset_and_skew.py
          python examples/asymmetry_bias.py
          python examples/allan_deviation.py
          python examples/uncertainty_coverage.py
          python examples/asymmetry_benchmark.py
          python examples/exchange_timeline.py
          python examples/benchmark_table.py
