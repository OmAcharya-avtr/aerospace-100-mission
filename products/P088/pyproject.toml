[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmtcdiff"
version = "0.1.0"
description = "Diff two telemetry and command dictionaries and report which existing procedures and analyses break or silently change meaning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "telemetry",
    "telecommand",
    "spacecraft-operations",
    "semantic-diff",
    "change-impact-analysis",
    "mission-database",
    "regression-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

# Every range below is bounded on BOTH sides, at the versions every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole suite while its validation numbers moved.
#
# This package's runtime dependency surface is deliberately small. The diff,
# the taxonomy, the reference extraction and the impact report are pure
# standard library; difflib supplies the Ratcliff/Obershelp similarity.
#
# scipy is used for exactly two things: scipy.optimize.linear_sum_assignment
# for the optimal rename pairing, and scipy.stats.beta for the Clopper-Pearson
# interval on a measured rate. Both are long-stable public APIs, so the ceiling
# is at the minor version rather than the patch. numpy is a transitive
# requirement of scipy and is used directly in the examples and in the metric
# aggregation; it is bounded because numpy has resolved to three different
# patch releases across sessions of this mission on an unbounded specifier.
#
# The cost of these ceilings is real and is recorded in README.md under
# Limitations: this package cannot take a scipy 1.19 or numpy 2.6 release
# without a port and a re-measure. That is a deliberate trade, not an oversight.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
# ruff is bounded across the two versions this package was measured clean
# under in one session: 0.16.9 (the pinned environment) and 0.17.3 (the system
# interpreter's). A product in an earlier batch of this mission was blocked at
# the release gate on a rule that did not exist in the version it was built
# with, so both were run here and both are inside this range.
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16.9,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
tmtcdiff = "tmtcdiff.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/tmtcdiff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tmtcdiff"]
known-local-folder = ["_bootstrap", "_common"]
