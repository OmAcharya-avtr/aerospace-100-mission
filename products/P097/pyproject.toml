[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakerank"
version = "0.1.0"
description = "Ranks intermittently failing tests by the cost of their intermittency, and reports how far that ranking disagrees with ranking by flake rate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "flaky-tests",
    "intermittent-failure",
    "test-prioritisation",
    "continuous-integration",
    "geometric-distribution",
    "kendall-tau",
    "spearman",
    "rank-correlation",
    "bootstrap",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

# EVERY RANGE IS BOUNDED ON BOTH SIDES, at the version every number in this
# repository was measured against. A floor with no ceiling is not a dependency
# specification: five of the first fifty products of this mission were found
# broken or silently wrong for a new install because pip resolved a release
# published after the product was measured, and one of the five passed its whole
# suite while its validation numbers moved, which is the dangerous one.
#
# WHAT EACH DEPENDENCY IS USED FOR, so a bound can be argued with rather than
# taken on trust.
#
# numpy -- the columnar attempt table, the grouped accumulation with
# `numpy.add.at`, `numpy.random.default_rng` (PCG64) for every bootstrap
# resample and for the committed history generator, and `numpy.quantile` for
# the percentile intervals. The bound is NUMERICAL and not merely an API bound:
# `tests/test_determinism.py` asserts that two bootstrap runs at the declared
# seed give identical interval ends, which depends on PCG64's draw order, and
# `data/run_history.json` is reproducible only from the same generator stream.
#
# scipy -- `scipy.stats.kendalltau(variant="b")` and `scipy.stats.spearmanr`,
# used ONLY as an independently written implementation to cross-check this
# product's own rank statistics in `tests/test_disagreement.py` and
# `validation/validate_disagreement.py`. The shipped statistics in
# `src/flakerank/disagreement.py` are this product's own and depend on numpy
# alone, so a reader can check them against the cited formulae without reading
# scipy.
#
# scikit-learn -- `sklearn.ensemble.RandomForestRegressor`, the only learned
# component. The ceiling is declared even though NO MODEL IS SERIALISED
# anywhere in this repository: a scikit-learn pickle is not portable across
# minor versions -- 1.9.1 cannot unpickle a 1.8.0 model, measured in this
# mission -- and the numbers in MODEL_CARD.md belong to the version that
# produced them. The repository ships no .joblib, .pkl or .ckpt file and
# `validation/validate_tree_hygiene.py` checks that it does not.
#
# NOTHING ELSE. The closed-form geometric re-run count in
# `src/flakerank/geometric.py`, which is the mathematical core, uses `math`
# alone. That is deliberate: the one part of this product a reader must be able
# to check by hand has no dependency at all.
#
# MEASURED AT: Python 3.13.18, numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1,
# pytest 9.1.1, hypothesis 6.170.15, matplotlib 3.11.2, ruff 0.16.9, on x86_64
# Linux with 2 cores.
#
# NOT YET RUN AT BOTH ENDS OF EVERY RANGE. The build guide asks for the suite
# and the committed validation output to be compared at the floor and the
# ceiling of each declared range in an isolated environment. That was not done
# for this product -- the build agent is forbidden from running `pip` at all,
# because a concurrent install mutated numpy mid-build in an earlier batch of
# this mission -- and the omission is recorded in README.md under Limitations
# rather than papered over. The declared ranges are the minor series that was
# measured, which is narrower than a floor with no ceiling and weaker than a
# measured range.
#
# A pin below a future security release is a real cost and not a free safety
# measure: this product cannot take such a release without a port. The tension
# is recorded in README.md under Limitations rather than resolved by removing
# the ceiling.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171", "ruff>=0.16,<0.18"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
flakerank = "flakerank.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/flakerank"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# `-p no:cacheprovider` keeps pytest from writing .pytest_cache into the tree.
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    "error",
    # scipy warns when asked for a correlation against a constant vector. One
    # regression test does exactly that on purpose, to pin the single case
    # where this product's tau-b and scipy's deliberately differ.
    "ignore:An input array is constant:RuntimeWarning",
    "ignore:An input array is constant",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["flakerank"]
known-local-folder = ["_bootstrap", "_support"]
