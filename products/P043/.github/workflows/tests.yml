name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/ benchmark/
      - name: Test
        run: python -m pytest tests/ -q
      - name: Validation scripts
        working-directory: validation
        run: |
          python validate_webb_limits.py
          python validate_deadtime.py
          python validate_afterpulse.py
          python validate_ppm.py
          python validate_capacity.py
          python validate_simulator.py
          python validate_hal_contract.py
          python validate_correction.py
          python worked_example.py
      - name: Examples
        working-directory: examples
        env:
          MPLBACKEND: Agg
        run: |
          python webb_limits.py
          python deadtime_curves.py
          python ppm_error_and_rate.py
          python correction_vs_baselines.py
      - name: Benchmark
        working-directory: benchmark
        run: python run_benchmark.py
