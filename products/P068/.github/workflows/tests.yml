name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: CLI
        run: python -m degradepredict --help
      - name: Validation scripts
        run: |
          python validation/validate_crossing.py
          python validation/validate_baselines.py
          python validation/validate_physics.py
          python validation/validate_headtohead.py
          python validation/validate_calibration.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/trajectory_gallery.py
          python examples/baseline_intervals.py
          python examples/forecast_distribution.py
          python examples/coverage_split.py
          python examples/calibration_curves.py
          python examples/score_comparison.py
          python examples/censoring_effect.py
