name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m boundcompress --version
          python -m boundcompress info
          python -m boundcompress certify --signal battery_voltage --bound 5e-4
          python -m boundcompress negative-control --signal battery_voltage --bound 5e-4
      - name: Validation scripts
        run: |
          python validation/validate_bound_every_sample.py
          python validation/validate_negative_control.py
          python validation/validate_roundtrip_determinism.py
          python validation/validate_rate_distortion.py
          python validation/validate_predictors.py
          python validation/validate_learned.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Validation scripts from the gate's working directory
        run: |
          cd validation
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/telemetry_shapes.py
          python examples/certificate_error_profile.py
          python examples/negative_control.py
          python examples/rate_distortion_curve.py
          python examples/predictor_comparison.py
          python examples/entropy_versus_realised_rate.py
          python examples/rate_breakdown.py
          python examples/guarantee_cost.py
          python examples/learned_uncertainty.py
