[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveforge"
version = "0.1.0"
description = "Adaptive-optics sizing and closed-loop simulation: Kolmogorov screens, Shack-Hartmann sensing, deformable-mirror control, cited error budgets, and a learned predictive controller with uncertainty"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "adaptive-optics",
    "wavefront-sensing",
    "atmospheric-turbulence",
    "zernike",
    "predictive-control",
    "aerospace",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.scripts]
waveforge = "waveforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Comparisons in tests read naturally as "computed == expected".
"tests/*" = ["SIM300"]
