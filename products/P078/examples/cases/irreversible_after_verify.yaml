name: irreversible_after_verify
description: >-
  The corrected counterpart of irreversible_before_verify: the same
  declarations with the verification moved ahead of the deployment. The gate
  returns NO_REFUSAL_FOUND, which is named for what was measured and is not a
  statement that the sequence is safe to uplink. This case is part of the
  negative control set.
dictionary:
  resource_limits:
    power_w: 120.0
  commands:
    - id: PWR_BUS_CHECK
      subsystem: power
      effects:
        bus_voltage_ok: true
      resource_draw:
        power_w: 2.0
      min_gap_after_s: 2.0
    - id: ADCS_ATT_VERIFY
      subsystem: adcs
      preconditions:
        bus_voltage_ok: true
      effects:
        attitude_verified: true
      resource_draw:
        power_w: 8.0
      hold_s: 20.0
      min_gap_after_s: 5.0
    - id: ANT_DEPLOY
      subsystem: structures
      required_modes: [NOMINAL]
      preconditions:
        antenna_deployed: false
        attitude_verified: true
        bus_voltage_ok: true
      effects:
        antenna_deployed: true
      resource_draw:
        power_w: 20.0
      hold_s: 10.0
      min_gap_after_s: 30.0
      irreversible: true
mode_machine:
  modes: [SAFE, NOMINAL]
  transitions:
    SAFE: [NOMINAL]
    NOMINAL: [SAFE]
initial_state:
  mode: NOMINAL
  predicates:
    antenna_deployed: false
    attitude_verified: unknown
    bus_voltage_ok: true
sequence:
  - {t_s: 0.0, command: PWR_BUS_CHECK}
  - {t_s: 10.0, command: ADCS_ATT_VERIFY, note: "the verification, ahead of the deployment"}
  - {t_s: 60.0, command: ANT_DEPLOY}
