name: resource_and_exclusion
description: >-
  Hand-constructed multi-defect case covering the four violation kinds that no
  per-command check can reach: mutual exclusion over a live hold, a resource
  ceiling crossed by accumulation rather than by any single command, a minimum
  inter-command gap, and a minimum same-command interval. Six violations are
  expected and every one of them is hand-derived in
  validation/validate_forward_known.py. No command in this dictionary exceeds
  a ceiling on its own, which is the point: the per-command lint's own
  single-command resource check cannot fire here.
dictionary:
  resource_limits:
    power_w: 100.0
    data_rate_mbps: 40.0
  commands:
    - id: PWR_BUS_CHECK
      subsystem: power
      effects:
        bus_voltage_ok: true
      resource_draw:
        power_w: 2.0
      min_gap_after_s: 2.0
    - id: HEATER_A
      subsystem: thermal
      preconditions:
        bus_voltage_ok: true
      resource_draw:
        power_w: 40.0
      hold_s: 200.0
      min_gap_after_s: 2.0
      exclusion_group: thermal_pair
    - id: HEATER_B
      subsystem: thermal
      preconditions:
        bus_voltage_ok: true
      resource_draw:
        power_w: 40.0
      hold_s: 200.0
      min_gap_after_s: 2.0
      exclusion_group: thermal_pair
    - id: XMIT
      subsystem: comms
      preconditions:
        bus_voltage_ok: true
      resource_draw:
        power_w: 55.0
      hold_s: 100.0
      min_interval_s: 300.0
      min_gap_after_s: 20.0
    - id: SSR_WRITE
      subsystem: recorder
      resource_draw:
        data_rate_mbps: 30.0
      hold_s: 60.0
      min_gap_after_s: 2.0
    - id: SSR_READ
      subsystem: recorder
      resource_draw:
        data_rate_mbps: 25.0
      hold_s: 60.0
      min_gap_after_s: 2.0
mode_machine:
  modes: [NOMINAL]
  transitions:
    NOMINAL: []
initial_state:
  mode: NOMINAL
  predicates:
    bus_voltage_ok: true
sequence:
  - {t_s: 0.0, command: PWR_BUS_CHECK}
  - {t_s: 10.0, command: HEATER_A, note: "takes thermal_pair until t=210 s"}
  - {t_s: 60.0, command: HEATER_B, note: "mutual exclusion: thermal_pair still held"}
  - {t_s: 70.0, command: XMIT, note: "40 + 40 + 55 = 135 W against a 100 W ceiling"}
  - {t_s: 80.0, command: SSR_WRITE, note: "10 s after XMIT, which declares a 20 s gap"}
  - {t_s: 100.0, command: SSR_READ, note: "30 + 25 = 55 Mbps against a 40 Mbps ceiling"}
  - {t_s: 200.0, command: XMIT, note: "130 s after its own last run against a 300 s interval"}
