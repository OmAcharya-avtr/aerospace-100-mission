[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jitterscope"
version = "0.1.0"
description = "Platform jitter/vibration characterization for optical pointing with telemetry anomaly detection"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "hypothesis>=6.90"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
