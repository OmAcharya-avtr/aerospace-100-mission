[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transfergap"
version = "0.1.0"
description = "Bound the simulation-to-field discrepancy from a handful of paired measurements, and say how many more are needed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "digital-twin",
    "simulation-to-field",
    "concentration-inequality",
    "empirical-bernstein",
    "tolerance-interval",
    "conformal-prediction",
    "exchangeability",
    "sample-size",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole test suite while its validation numbers moved.
#
# numpy carries every array operation here and, specifically, the quantile
# interpolation of `numpy.quantile`. The split-conformal quantile of
# `transfergap.resample` is taken as an ORDER STATISTIC by integer index
# rather than through `numpy.quantile`, precisely so that a change in the
# default interpolation cannot move it; but the bootstrap percentile limits do
# use `numpy.quantile`, and the Monte Carlo rates in validation/ are reported
# to four decimal places, so a change there would be visible.
#
# scipy supplies `scipy.stats.nct` for the exact one-sided normal tolerance
# factor, `scipy.stats.norm` and `scipy.stats.t` for the interval multipliers,
# `scipy.stats.binom` for the EXACT binomial tail that the independent bound
# check in validation/validate_independent_bound.py is built on, and
# `scipy.stats.beta` for the Beta(n, 1) order-statistic law. The binomial tail
# check compares an exact sum against an exponential closed form over nineteen
# decades of probability, so its numbers rest on scipy's tail accuracy.
#
# scikit-learn fits the learned discrepancy model
# (`GradientBoostingRegressor` with the pinball loss). The ceiling is at the
# next minor version because the quantile-loss tree builder's tie-breaking is
# not part of scikit-learn's public API contract, and the learned model's
# measured coverage in this repository is a threshold comparison on its
# output. No model artifact is serialised or committed by this product -- every
# model in validation/ is refitted from a declared seed by the script that
# reports it -- so there is no pickle whose format needs bounding.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible for numpy, scipy, scikit-learn, matplotlib, pytest and hypothesis:
# the build environment is a shared pre-pinned interpreter that this product is
# forbidden to modify, and installing a second version of any of them would
# have required running pip. Those ranges are bounded at the single version
# each was MEASURED at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1,
# matplotlib 3.11.2, pytest 9.1.1, hypothesis 6.170.14 -- widened only to the
# patch floor the code plainly supports. The ruff range is the one exception:
# two ruff installations were present in the measured environment, 0.16.9 on
# the path and 0.17.3 as a Python module, and `ruff check src/ tests/
# examples/ validation/` is clean under both, so that range is measured at
# both ends. This is recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
transfergap = "transfergap.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/transfergap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["transfergap"]
known-local-folder = ["_bootstrap", "_common"]
