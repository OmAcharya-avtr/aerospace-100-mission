name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junit-xml=junit.xml
      - name: Test count from junit XML, never from stdout
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          declared = int(suite.get("tests", "0"))
          counted = len(suite.findall(".//testcase"))
          print(f"declared {declared}, counted {counted}")
          if declared == 0 or declared != counted:
              sys.exit("junit.xml does not agree with itself, or no test ran")
          PY
      - name: CLI
        run: |
          python -m transfergap --version
          python -m transfergap bounds --n 60 --seed 202
          python -m transfergap bounds --n 15 --seed 101
          python -m transfergap plan --n 15 --target-slack 2.0
          python -m transfergap exchangeability --n 120 --campaign swept --permutations 399
          python -m transfergap learned --n 60 --seed 202
          python -m transfergap truth --draws 50000
      - name: Validation scripts
        run: |
          python validation/validate_bounds.py
          python validation/validate_independent_bound.py
          python validation/validate_exchangeability.py
          python validation/validate_inversion.py
          python validation/validate_learned_model.py
          python validation/validate_negative_controls.py
          python validation/validate_approx_audit.py
          python validation/worked_example.py
      - name: Validation scripts from the gate's working directory
        run: |
          cd validation
          for script in validate_*.py worked_example.py; do
            python "$script" > /dev/null
          done
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/bound_comparison.py
          python examples/coverage_vs_width.py
          python examples/sample_count_inversion.py
          python examples/exchangeability_test.py
          python examples/learned_discrepancy.py
          python examples/conformal_bracket.py
      - name: The tree must be clean of caches and absolute paths
        run: python validation/validate_cli.py
