[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaudit"
version = "0.1.0"
description = "Requirements-to-test traceability computed from a repository, with findings and a non-zero exit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Om Acharya" }]
keywords = ["traceability", "requirements", "junit", "pytest", "assurance", "aerospace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
# No runtime dependencies: the whole audit is standard library (re, ast,
# xml.etree, json, argparse). Matplotlib is needed only for the figures.
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "hypothesis>=6.80", "matplotlib>=3.7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/traceaudit"
Source = "https://github.com/OmAcharya-avtr/traceaudit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# xunit1 records the source file and line of every test case, which the
# assertion heuristic uses to find the function it is judging. The default
# xunit2 family omits both; traceaudit then falls back to the classname.
junit_family = "xunit1"
filterwarnings = ["error::DeprecationWarning"]
markers = ["verifies(req_id): requirement id this test verifies"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
