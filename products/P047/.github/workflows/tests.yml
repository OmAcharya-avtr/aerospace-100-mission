name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: CLI
        run: python -m slotsync --help
      - name: Validation scripts
        working-directory: validation
        env:
          PYTHONPATH: ../src
        run: |
          python validate_scurve_gains.py
          python validate_loop_coefficients.py
          python validate_jitter_agreement.py
          python validate_cycle_slips.py
          python validate_self_noise_bias.py
          python validate_ppm_slot.py
          python worked_example.py
      - name: Examples
        working-directory: examples
        env:
          PYTHONPATH: ../src
          MPLBACKEND: Agg
        run: |
          python scurves.py
          python loop_design.py
          python jitter_prediction_vs_simulation.py
          python cycle_slip_threshold.py
          python ppm_slot_clock.py
