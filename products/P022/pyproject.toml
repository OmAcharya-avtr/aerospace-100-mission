[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmgsteer"
version = "0.1.0"
description = "Control-moment-gyro array geometry, Jacobian and singularity analysis, and steering laws (pseudo-inverse, singularity-robust, generalised SR, null motion) with a benchmarked learned null-motion policy"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["control-moment-gyro", "cmg", "singularity", "steering-law", "spacecraft", "aerospace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/cmgsteer"
Source = "https://github.com/OmAcharya-avtr/cmgsteer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
