[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codedfade"
version = "0.1.0"
description = "Coded free-space-optical link performance over temporally correlated fading, with interleaver depth as the design variable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "free-space-optical",
    "atmospheric-turbulence",
    "scintillation",
    "gamma-gamma",
    "lognormal-fading",
    "reed-solomon",
    "convolutional-code",
    "interleaver",
    "level-crossing-rate",
    "fade-duration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
examples = ["matplotlib"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib", "joblib"]

[project.scripts]
codedfade = "codedfade.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
