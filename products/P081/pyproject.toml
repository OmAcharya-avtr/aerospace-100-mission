[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twindiverge"
version = "0.1.0"
description = "Attribute a twin-versus-reality residual to a parameter subset, after reporting which parameters the supplied telemetry cannot identify at all."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "digital-twin",
    "structural-identifiability",
    "practical-identifiability",
    "fisher-information",
    "cramer-rao",
    "profile-likelihood",
    "sensitivity-analysis",
    "parameter-attribution",
    "reaction-wheel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole test suite while its validation numbers moved.
#
# numpy carries every array operation here. The singular value decomposition of
# equation (8), the QR factorisations behind the null-space bases and the
# principal angles of `identifiability.subspace_angles_deg` are all
# `numpy.linalg`, and their results are reported to twelve significant figures.
#
# scipy supplies three things, all load-bearing for published numbers:
# `scipy.optimize.least_squares`, which is the inner minimisation of the profile
# likelihood of equation (17); `scipy.stats.chi2` and `scipy.stats.norm`, which
# set every threshold and interval; and `scipy.stats.beta`, which is the exact
# Clopper-Pearson interval of `twindiverge.scoring`.
#
# scikit-learn supplies `GradientBoostingClassifier`. Its fitting is
# reproducible WITHIN a version given a fixed `random_state` and that is not
# part of its public API contract across versions, so the ceiling is at the
# minor version. No model artifact is serialised or committed by this product --
# every model in validation/ is refitted from a declared seed by the script that
# reports it -- so there is no pickle whose format needs bounding.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible for numpy, scipy, scikit-learn, matplotlib, pytest and hypothesis:
# the build environment is a shared pre-pinned interpreter that this product is
# forbidden to modify, and installing a second version of any of them would
# have required running pip. Those ranges are bounded at the single version each
# was MEASURED at -- numpy 2.5.3, scipy 1.18.1, scikit-learn 1.9.1,
# matplotlib 3.11.2, pytest 9.1.1, hypothesis 6.170.15 -- widened only to the
# patch floor the code plainly supports. The ruff range is the one exception:
# two ruff installations were present in the measured environment, 0.16.9 on the
# path and 0.17.4 as a Python module, and `ruff check src/ tests/ examples/
# validation/` is clean under both, so that range is measured at both ends. This
# is recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
twindiverge = "twindiverge.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/twindiverge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["twindiverge"]
known-local-folder = ["_bootstrap", "_common"]
