[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointmodel"
version = "0.1.0"
description = "Decompose a pointing error budget from measured residuals, and refuse to split the terms the observed geometry cannot separate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "pointing-model",
    "telescope",
    "antenna",
    "alt-azimuth",
    "least-squares",
    "identifiability",
    "atmospheric-refraction",
    "robust-regression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole test suite while its validation numbers moved.
#
# numpy carries the linear algebra this package is made of. `pointmodel.wls`
# and `pointmodel.identifiability` depend on `numpy.linalg.svd` returning the
# singular values in descending order and on the sign and row convention of
# the returned `vt`, which are documented and long stable; and on float64
# arithmetic throughout. The ceiling is at the next minor version because the
# rank verdicts in this repository rest on singular values at the 1e-15 level
# on the `single_az` geometry, where a change in the LAPACK driver numpy
# dispatches to would move them. That is not a hypothetical: the verdict is a
# threshold comparison on a quantity at machine precision.
#
# scipy supplies `scipy.integrate.quad` for the refraction integral of
# equation (4) and `scipy.stats.t` / `scipy.stats.norm` for the confidence
# interval multipliers. The quadrature's reported absolute error on the
# refraction integral is below 1e-8 arcsec at the tolerances requested, and
# the refraction cross-check numbers in validation/ are stated to four
# decimal places, so a change in the adaptive subdivision would be visible.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible for numpy, scipy, matplotlib, pytest and hypothesis: the build
# environment is a shared pre-pinned interpreter that this product is
# forbidden to modify, and installing a second version of any of them would
# have required running pip. Those ranges are therefore bounded at the single
# version each was MEASURED at -- numpy 2.5.3, scipy 1.18.1, matplotlib
# 3.11.2, pytest 9.1.1, hypothesis 6.170.14 -- widened only to the patch
# floor the code plainly supports. The ruff range is the one exception: two
# ruff installations were present in the measured environment, 0.16.9 on the
# path and 0.17.3 as a Python module, and `ruff check src/ tests/ examples/
# validation/` is clean under both, so that range is measured at both ends.
# This is recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
pointmodel = "pointmodel.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/pointmodel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pointmodel"]
known-local-folder = ["_bootstrap", "_common"]
