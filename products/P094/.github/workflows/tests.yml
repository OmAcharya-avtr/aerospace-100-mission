name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junit-xml=junit.xml
      # Every validation script is executed. All of them read the committed
      # hardware campaign in data/traces/, which is in the repository, so none
      # of them refuses for want of measured data. validate_pypi_probe.py needs
      # outbound HTTPS to pypi.org and will fail without it; that failure is a
      # failure of the probe's control, which is the designed behaviour, because
      # a name-availability claim with an unreachable control is not a
      # measurement.
      - name: Validation scripts
        run: |
          for script in validation/*.py; do
            case "$(basename "$script")" in _*) continue;; esac
            python "$script"
          done
