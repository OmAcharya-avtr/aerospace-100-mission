name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/ data/ conftest.py
      - name: Test
        run: python -m pytest tests/ -q
      - name: Validation scripts
        run: |
          python validation/field_model_check.py
          python validation/momentum_monotonicity.py
          python validation/controllability_gap.py
