[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activityplan"
version = "0.1.0"
description = "Onboard spacecraft activity planning with an auditable feasibility report: the binding constraint and the slack on every other one."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "activity-planning",
    "mission-planning",
    "oversubscribed-scheduling",
    "mixed-integer-programming",
    "spacecraft-power-budget",
    "conformal-prediction",
    "autonomous-aerospace-systems",
    "feasibility-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.5.3,<2.6",
    "scipy>=1.18.1,<1.19",
    "scikit-learn>=1.9.1,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<9.2", "hypothesis>=6.169.3,<6.170"]
examples = ["matplotlib>=3.11.2,<3.12"]
dev = [
    "pytest>=9.1.1,<9.2",
    "hypothesis>=6.169.3,<6.170",
    "ruff>=0.16.8,<0.18",
    "matplotlib>=3.11.2,<3.12",
]

[project.scripts]
activityplan = "activityplan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["activityplan"]
known-local-folder = ["_bootstrap"]
