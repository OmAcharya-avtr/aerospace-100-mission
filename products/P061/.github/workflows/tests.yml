name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: CLI
        run: python -m activityplan --help
      - name: Validation scripts
        run: |
          python validation/validate_energy.py
          python validation/validate_exact.py
          python validation/validate_gap.py
          python validation/validate_predictor.py
          python validation/validate_warmstart.py
          python validation/validate_robust.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/timeline_plot.py
          python examples/feasibility_slack.py
          python examples/instance_portraits.py
          python examples/greedy_vs_exact.py
          python examples/prediction_intervals.py
          python examples/robust_tradeoff.py
          python examples/warmstart_nodes.py
