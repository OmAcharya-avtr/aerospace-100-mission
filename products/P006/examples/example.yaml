# 10 km terrestrial FSO link, 1550 nm — matches validation case 4.
tx_power_dbm: 20.0                # 100 mW laser
wavelength_nm: 1550.0
beam_divergence_rad: 1.0e-3       # FULL angle (1/e^2 full angle for Gaussian)
range_km: 10.0
rx_aperture_diameter_m: 0.1
rx_sensitivity_dbm: -40.0
tx_optics_efficiency: 0.8
rx_optics_efficiency: 0.8
pointing_error_rad: 0.25e-3       # static radial offset
atmos_attenuation_db_per_km: 0.5  # clear air (user-supplied, e.g. Kim et al. 2001 model)
beam_profile: gaussian            # or flattop

uncertainties:                    # 1-sigma, same units as the field above
  tx_power_dbm: 0.5
  atmos_attenuation_db_per_km: 0.05
  pointing_error_rad: 0.02e-3
