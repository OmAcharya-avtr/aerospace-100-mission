[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkbudgetx"
version = "0.1.0"
description = "Deterministic, unit-aware free-space optical (FSO) link-budget library (educational)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OPTIMA Organisation" }]
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
