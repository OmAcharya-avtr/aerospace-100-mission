name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,plot]" ruff
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        run: python -m pytest tests/ -q
      - name: Examples
        run: |
          cd examples
          python torque_profile_over_orbit.py
          python altitude_sweep_and_crossover.py
