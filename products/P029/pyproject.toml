[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentummgr"
version = "0.1.0"
description = "Reaction-wheel momentum management: accumulation from the disturbance environment, magnetic and thruster desaturation with the field-direction controllability constraint, wheel zero-speed avoidance, and a learned desaturation scheduler benchmarked against a tuned fixed-threshold baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "spacecraft",
    "attitude control",
    "momentum management",
    "reaction wheel",
    "desaturation",
    "magnetorquer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "hypothesis>=6.80", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
momentummgr = "momentummgr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
