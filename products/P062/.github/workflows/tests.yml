name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Record the resolved dependency versions
        run: python -c "import numpy, scipy, sklearn; print(numpy.__version__, scipy.__version__, sklearn.__version__)"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: Test counts from the junit XML, never from pytest stdout
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          cases = len(root.findall(".//testcase"))
          print(dict(suite.attrib))
          print("testcase elements:", cases)
          assert int(suite.attrib["tests"]) == cases, "testsuite count disagrees with testcase count"
          assert cases > 0, "the suite collected zero tests"
          assert int(suite.attrib.get("failures", 0)) == 0
          assert int(suite.attrib.get("errors", 0)) == 0
          PY
      - name: CLI
        run: python -m twincalib --help
      - name: Validation scripts
        run: |
          python validation/validate_model.py
          python validation/validate_sensitivity.py
          python validation/validate_identifiability.py
          python validation/validate_recovery.py
          python validation/validate_profile.py
          python validation/validate_coverage.py
          python validation/validate_residual.py
          python validation/validate_absorption.py
          python validation/validate_cli.py
          python validation/worked_example.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/identifiability_spectrum.py
          python examples/profile_likelihood.py
          python examples/parameter_recovery.py
          python examples/twin_fit_overview.py
          python examples/residual_benchmark.py
          python examples/absorption_subspaces.py
