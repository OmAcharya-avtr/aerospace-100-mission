[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atmoprofile"
version = "0.1.0"
description = "Deterministic atmospheric turbulence integrals: Fried parameter, isoplanatic angle, Greenwood frequency, slant-path Rytov variance and weak-regime scintillation index from any Cn^2 profile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["turbulence", "adaptive optics", "Fried parameter", "Cn2", "atmospheric optics"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "hypothesis>=6.80", "ruff>=0.4", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
