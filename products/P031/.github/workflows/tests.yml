name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ examples/ validation/

      - name: Test
        run: python -m pytest tests/ -q

      - name: Validation scripts
        env:
          MPLBACKEND: Agg
        run: |
          for f in validation/*.py; do
            echo "=== $f"
            python "$f" > /dev/null
          done

      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          for f in examples/*.py; do
            echo "=== $f"
            python "$f" > /dev/null
          done
