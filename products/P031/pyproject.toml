[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hilforge"
version = "0.1.0"
description = "Hardware-in-the-loop harness for a GNC or comms control loop: HAL with simulation/device parity, deadline accounting, dry-run rehearsal and a benchmark record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
  "hardware-in-the-loop",
  "hil",
  "real-time",
  "deadline",
  "overrun",
  "latency",
  "gnc",
  "aerospace",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
hilforge = "hilforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
