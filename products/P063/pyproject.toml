[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safemodetree"
version = "0.1.0"
description = "From an FMEA table to a fault-response policy, with a safe-mode reachability check and ambiguity-class analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Om Acharya" }]
keywords = [
  "fmea",
  "fdir",
  "safe-mode",
  "fault-response",
  "reachability",
  "diagnosability",
  "calibration",
  "aerospace",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# Both ends of every range below were installed and the whole suite plus every
# validation script was run at each end. See README "Dependency ranges" and
# validation/validate_environment_output.txt for the measured versions.
dependencies = [
  "numpy>=2.1.3,<2.6",
  "scikit-learn>=1.5.2,<1.10",
  "pyyaml>=6.0.2,<6.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9.2,<3.12"]
test = [
  "pytest>=8.3.3,<9.2",
  "hypothesis>=6.112.1,<6.170",
  "matplotlib>=3.9.2,<3.12",
  "ruff>=0.6.9,<0.18",
]

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/safemodetree"
Source = "https://github.com/OmAcharya-avtr/safemodetree"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safemodetree = ["specs/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
