name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,plot]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q --junitxml=junit.xml
      - name: CLI smoke test
        run: python -m safemodetree info
      - name: Known answers
        env:
          PYTHONPATH: src
        run: python validation/validate_known_answers.py
      - name: Planted case
        env:
          PYTHONPATH: src
        run: python validation/validate_planted_case.py
