name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: Validation scripts
        env:
          MPLBACKEND: Agg
        run: |
          python validation/validate_persistence_trace.py
          python validation/validate_far_design.py
          python validation/validate_cusum_delay.py
          python validation/validate_changepoint.py
          python validation/validate_matched_far.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          cd examples
          for f in *.py; do python "$f"; done
