[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passplanner"
version = "0.1.0"
description = "Optical ground-station contact planner: SGP4 passes, cloud-availability weighting, greedy + ILP scheduling"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "sgp4",
    "pulp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
