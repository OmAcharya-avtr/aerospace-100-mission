# Example scenario for `python -m passplanner plan --config scenario_example.yaml`
#
# The TLE is a real HISTORIC element set (ISS, epoch 2008-09-20, from the
# python-sgp4 documentation) used purely as a demonstration fixture; the
# planning window matches its epoch. Stations are fictional placeholders
# (see stations_example.yaml).

window:
  start: "2008-09-20T12:00:00Z"
  end:   "2008-09-21T12:00:00Z"

satellites:
  - name: ISS (ZARYA)
    tle:
      - "1 25544U 98067A   08264.51782528 -.00002182  00000-0 -11606-4 0  2927"
      - "2 25544  51.6416 247.4627 0006703 130.5360 325.0288 15.72125391563537"

stations_file: stations_example.yaml

scheduler: both          # greedy | ilp | both
setup_time_s: 60.0

# Optional forecast overrides (illustrative): a cloudy night at the alpine
# site drops its availability well below the September climatological prior.
forecast:
  - station: Alpengipfel OGS
    start: "2008-09-20T18:00:00Z"
    end:   "2008-09-21T06:00:00Z"
    p_clear: 0.10
