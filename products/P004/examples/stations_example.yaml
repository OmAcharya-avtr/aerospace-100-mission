# Example optical ground stations for passplanner.
#
# IMPORTANT: These stations are FICTIONAL-BUT-PLAUSIBLE ILLUSTRATIVE
# PLACEHOLDERS. The names, coordinates and monthly clear-sky probabilities
# are invented for demonstration and testing. They are NOT real sites and
# NOT real site statistics. Replace them with your own surveyed values.
#
# monthly_clear_prob: 12 values Jan..Dec, probability in [0, 1] that the
# optical line of sight is usable (climatological prior).

stations:
  - name: Cerro Ficticio OGS          # fictional arid high-altitude site
    lat_deg: -24.50
    lon_deg: -70.20
    alt_km: 2.60
    min_elevation_deg: 20.0
    data_rate_gbps: 10.0
    monthly_clear_prob: [0.88, 0.86, 0.85, 0.84, 0.82, 0.80, 0.81, 0.83, 0.85, 0.87, 0.88, 0.89]

  - name: Alpengipfel OGS             # fictional temperate alpine site
    lat_deg: 47.10
    lon_deg: 10.90
    alt_km: 2.00
    min_elevation_deg: 20.0
    data_rate_gbps: 10.0
    monthly_clear_prob: [0.38, 0.40, 0.44, 0.46, 0.50, 0.54, 0.58, 0.56, 0.52, 0.46, 0.38, 0.35]

  - name: Karoo Vlakte OGS            # fictional semi-arid plateau site
    lat_deg: -31.50
    lon_deg: 21.00
    alt_km: 1.60
    min_elevation_deg: 20.0
