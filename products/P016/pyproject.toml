[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zernkit"
version = "0.1.0"
description = "Zernike polynomial toolkit for adaptive optics: explicit Noll and OSA/ANSI indexing, orthonormal modes, analytic gradients, least-squares wavefront fitting and Noll residual variances."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = ["zernike", "adaptive-optics", "wavefront", "noll", "osa-ansi"]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
examples = ["matplotlib"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[project.scripts]
zernkit = "zernkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
