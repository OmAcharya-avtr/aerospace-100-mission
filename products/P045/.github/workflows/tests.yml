name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ examples/ validation/
      - name: Test
        run: python -m pytest tests/ -q
      - name: CLI
        run: python -m arqlonghaul --help
      - name: Validation scripts
        run: |
          python validation/validate_crc.py
          python validation/validate_burst_channel.py
          python validation/validate_window.py
          python validation/validate_harq.py
          python validation/worked_example.py
      - name: Long validation scripts
        run: |
          python validation/validate_closed_form.py
          python validation/validate_burst_goodput.py
          python validation/validate_policy.py
          python validation/export_policy_table.py
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/burst_vs_independent.py
          python examples/window_sizing.py
          python examples/harq_crossover.py
          python examples/policy_comparison.py
