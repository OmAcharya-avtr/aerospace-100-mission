[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refractpath"
version = "0.1.0"
description = "Slant-path atmospheric refraction by several independent standard methods, with their disagreement measured and the validity floor computed rather than asserted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OPTIMA Organisation" }]
keywords = [
    "atmospheric-refraction",
    "atmospheric-propagation",
    "pointing",
    "ray-tracing",
    "refractivity",
    "dispersion",
    "astronomy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Every range below is bounded on BOTH sides, at the version every number in
# this repository was measured against. A floor with no ceiling is not a
# dependency specification: five of the first fifty products of this mission
# were found broken or silently wrong for a new install because pip resolved a
# release published after the product was measured, and one of the five passed
# its whole suite while its validation numbers moved.
#
# numpy carries the array model, `np.trapezoid`-free summation, `log1p` and the
# `divide(..., where=)` form that equation (20) uses to avoid evaluating the
# integrand at a tangent point. All long-stable, but numpy has resolved to
# three different patch releases across sessions of this mission on an
# unbounded specifier, and one of the five breakages above was a silent change
# of published numbers.
#
# scipy is used for exactly one thing: `scipy.optimize.brentq`, to invert
# equation (16) from its published true-elevation form onto the apparent
# elevation. The ceiling is at the minor version because the root finder's
# convergence contract -- in particular that `xtol` and `rtol` are both
# honoured and that a bracket with equal signs raises rather than returns -- is
# behaviour this package relies on and is not a documented cross-minor promise.
#
# WHAT WAS NOT MEASURED, stated rather than implied. The build guide asks for
# the suite to be run at both ends of every declared range. That was not
# possible here: the build environment is a shared pre-pinned interpreter that
# this product is forbidden to modify, and installing a second version of numpy
# or scipy would have required running pip. Both ranges are therefore bounded
# at the single version each was MEASURED at -- numpy 2.5.3 and scipy 1.18.1 --
# widened only to the patch floor the code plainly supports. The ruff range is
# the one exception: 0.16.9 and 0.17.3 were both available and the source
# measured clean under both, so that range is measured at both ends. This is
# recorded in README.md under Limitations.
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "hypothesis>=6.170,<6.171"]
examples = ["matplotlib>=3.11,<3.12"]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.170,<6.171",
    "ruff>=0.16,<0.18",
    "matplotlib>=3.11,<3.12",
]

[project.scripts]
refractpath = "refractpath.__main__:main"

[project.urls]
Homepage = "https://github.com/OmAcharya-avtr/refractpath"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ISC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["refractpath"]
known-local-folder = ["_bootstrap", "_common"]
