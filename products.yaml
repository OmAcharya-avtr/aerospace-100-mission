    hardware_note: "HARDWARE-MEASURED 2026-11-13; this entry previously read HARDWARE-BLOCKED. THE HEADLINE: the mean-plus-margin rule understates the measured deadline-miss rate by a factor of 1.528423e+05, 95 per cent moving-block interval [3.635383e+04, 9.160321e+05], which EXCLUDES 1. The rule is not strawmanned - it corresponds to a margin of k = 5.221001 standard deviations and predicts 8.897912e-08 against a counted 1.359977e-02, 816 misses in 60001 releases. The EVT fit on the same data gives 6.727478e-03, low by 2.0215, so EVT is competitive on the tail-model task and the Gaussian rule is not. 417 of the 816 misses, 51.10 per cent, were releases that never executed at all. THE PRE-REGISTERED EXPECTATION IN SPEC.md WAS REFUTED on the forecasting task: the learned forest beat the classical speed-scaling predictor on both held-out splits, 0.025022 against 0.043799 MAE on held-out mixes and 0.007330 against 0.040879 on held-out time, and the refutation is published as the finding. Three campaigns ran on the board; the first wrote every job trace and no monitor file at all because the monitor subprocess was launched without an argument its own argparse declares required, and the first two mis-sized the payload by calibrating against a 1.2 s probe taken as the board went idle. Only the third is published and all three are recorded in VALIDATION.md."

