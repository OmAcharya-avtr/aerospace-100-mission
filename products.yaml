  - id: P091
    name: ThermalBudget
    batch: 10
    class: flagship
    category: hardware-in-the-loop
    summary: "Sustained on-board throughput of an autonomy or GNC pipeline AFTER the board reaches thermal equilibrium, against the short-burst figure a datasheet or a cold benchmark reports, with the gap between them as the headline output. Baseline 1 the cold-burst benchmark, implemented deliberately as the thing being refuted because it is what a bench measurement produces; baseline 2 a first-order thermal RC network fitted to the measured die-temperature rise giving the throttled steady-state clock in closed form; baseline 3 ground truth directly measured sustained throughput and die temperature from a soak run on the board, with the run-to-run spread reported as a bootstrap interval. Learned thermal-state predictor mapping a short warm-up trace to the eventual steady state, scored on held-out DUTY CYCLES and held-out AMBIENT conditions separately because a model can pass one and fail the other, with the expected result that the RC model is competitive and any learned margin is smaller than the run-to-run interval. WHAT IT DOES THAT EXISTING TOOLS DO NOT: thermal benchmarking tools report temperature and clock traces; none of them converts the throttled steady state into a sustained mission throughput with an interval attached, and none reports the cold-burst overstatement as its headline."
    ai_enabled: true
    validation_level: 4
    status: PUBLISHED
    validation_level_achieved: 4
    validation_level_note: "ACHIEVED LEVEL 4, AND THE FIRST IN THIS MISSION. The criterion is the mission's own: measured timing and resource figures come from an NVIDIA Jetson Orin Nano itself rather than from a model of one. They do. The board became reachable from the Mac for the first time on 2026-11-12, by passwordless SSH to the ssh host named jetson; it identifies itself as an NVIDIA Jetson Orin Nano Engineering Reference Developer Kit Super, aarch64, JetPack R36.4.7, kernel 5.15.148-tegra, 6 cores, 7619 MB, governor schedutil, cpuinfo_max_freq 1728000 kHz, power mode MAXN_SUPER. A 17-run campaign of 4992 one-second samples ran on it, and every headline figure in the product was computed from those traces by a named script under validation/, each re-executed by the coordinator independently of the build agent that wrote it. LEVEL 4 HERE IS NOT A CLAIM OF GENERALITY AND THE SCOPE IS PART OF THE RESULT: one power mode, because the board has no passwordless sudo and no other mode was reachable; one ambient, never instrumented or varied, so the held-out-AMBIENT evaluation axis this summary asks for is reported STRUCTURALLY UNMEASURABLE rather than dropped or approximated by the duty-cycle split; a CPU-only payload, the GPU having stayed at its 306 MHz devfreq floor in 4954 of 4975 samples with no engine-utilisation counter sampled at all, so CPU-only rests on a devfreq floor and not on a utilisation measurement; soaks no longer than 720 s against a measured die time constant of 88.85 s, so this is sustained-over-twelve-minutes and the enclosure's own time constant is longer than anything measured; and one board with its own heatsink and fan. THE COUNTING AMBIGUITY RECORDED AGAINST P095 IS NOW LIVE: scripts/quota_report.py counts validation_level, so it reports L4 built 2 of 5 while ACHIEVED L4 is 1 of 5, this product only. The script was again NOT edited, for the reason given in P095. NEEDS THE OWNER."
