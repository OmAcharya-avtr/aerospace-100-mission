    hardware_note: "HARDWARE-MEASURED 2026-11-12; this entry previously read HARDWARE-BLOCKED. The board was reachable and the campaign ran on it. THE HEADLINE IS A NEGATIVE RESULT: this board did NOT thermally throttle. Across the three duty-1.0 soaks, 0 of 9654 per-core clock samples sat below 1728000 kHz while the die rose 10.94 degC from 46.34 to 57.28, so the cold-burst overstatement is +1.6277 per cent with a 95 per cent interval of [-1.0870, +4.6481] which contains zero, and the verdict is INDISTINGUISHABLE. Baseline 2 reduces to baseline 1 because its clock-to-throughput chain has no thermal signal to act on. The learned predictor LOST to the RC baseline by 4.4084 degC mean absolute error, 17.13 times the run-to-run bootstrap half-width, and was not retuned. WHAT THE CAMPAIGN DID NOT COVER, BY NAME: any power mode other than MAXN_SUPER; any other ambient; any GPU or other engine load, since GR3D utilisation is not in the trace schema and was never sampled; any soak longer than 720 s; and any other board."
  - id: P092
    name: DeadlineRisk
    batch: 10
    class: flagship
    category: autonomous-aerospace-systems
    summary: "Deadline-miss probability for a hard-real-time autonomy loop running on the real board under co-resident contention, against the mean-plus-margin rule that understates the tail, with the understatement as the headline output. Baseline 1 mean execution time plus a fixed sigma margin, implemented deliberately as the thing being refuted because it is what the practice does; baseline 2 an extreme-value fit, generalised Pareto over the measured peaks-over-threshold tail, giving the miss probability in closed form with a declared threshold-choice diagnostic; baseline 3 ground truth the directly counted miss rate over a long measured run with a bootstrap confidence interval that accounts for serial dependence between consecutive deadlines. Learned contention-aware predictor mapping co-resident workload descriptors to a miss probability, scored on held-out WORKLOAD MIXES and held-out TIME separately, with the expected result that the EVT fit is competitive and any learned margin is smaller than the bootstrap interval on the counted reference. WHAT IT DOES THAT EXISTING TOOLS DO NOT: WCET analysers bound a single task on an idle processor and real-time tracers report observed maxima; neither produces a miss PROBABILITY with an interval under a named contention mix, which is the number a mission actually needs."
    ai_enabled: true
    validation_level: 4
    validation_level_achieved: 4
